<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6C5CE7;
      --primary-light: #a29bfe;
      --success: #00b894;
      --danger: #e17055;
      --warning: #fdcb6e;
      --skip: #b2bec3;
      --bg: #f8f9fe;
      --card: #ffffff;
      --text: #2d3436;
      --text-light: #636e72;
      --border: #eef0f8;
      --shadow: 0 4px 20px rgba(108, 92, 231, 0.08);
      --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px 16px 40px;
      max-width: 760px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
    }
    .hero {
      background: linear-gradient(135deg, #6C5CE7 0%, #a29bfe 50%, #74b9ff 100%);
      border-radius: 24px;
      padding: 32px 24px 28px;
      text-align: center;
      color: white;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 160px; height: 160px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: -40px; left: -40px;
      width: 120px; height: 120px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }
    .hero h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 6px;
      position: relative;
    }
    .hero .tagline {
      font-size: 0.95rem;
      opacity: 0.9;
      font-weight: 500;
      margin-bottom: 12px;
      position: relative;
    }
    .hero .date-pill {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      padding: 8px 20px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.9rem;
      position: relative;
    }
    .progress-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .progress-header span { font-weight: 700; font-size: 0.95rem; }
    .progress-pct {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
    }
    .progress-track {
      background: #eef0f8;
      border-radius: 12px;
      height: 14px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      width: 0%;
    }
    .stats-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .stat-chip {
      flex: 1;
      text-align: center;
      padding: 8px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .stat-pass { background: #e6f9f0; color: #00856a; }
    .stat-fail { background: #fde8e4; color: #c44025; }
    .stat-skip { background: #f0f0f5; color: #636e72; }
    .stat-num { display: block; font-size: 1.2rem; font-weight: 800; }
    .section {
      background: var(--card);
      border-radius: var(--radius);
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 20px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }
    .section-header:hover { background: #fafbff; }
    .section-num {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.95rem;
      color: white;
      flex-shrink: 0;
    }
    .section-header h2 {
      font-size: 1rem;
      font-weight: 700;
      flex: 1;
      line-height: 1.3;
    }
    .section-header h2 small {
      display: block;
      font-weight: 500;
      font-size: 0.78rem;
      color: var(--text-light);
      margin-top: 2px;
    }
    .section-badge {
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 700;
      background: #eef0f8;
      color: var(--text-light);
      white-space: nowrap;
    }
    .section-badge.done { background: #e6f9f0; color: #00856a; }
    .section-chevron {
      font-size: 1.2rem;
      color: #b2bec3;
      transition: transform 0.3s;
    }
    .section.collapsed .section-chevron { transform: rotate(-90deg); }
    .section.collapsed .section-body { display: none; }
    .section-body { padding: 0 20px 20px; }
    .intro-text {
      background: linear-gradient(135deg, #f8f9fe, #eef0f8);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.88rem;
      color: var(--text-light);
      line-height: 1.6;
      margin-bottom: 16px;
      border-left: 4px solid var(--primary-light);
    }
    .intro-text strong { color: var(--text); }
    .client-card {
      background: #fafbff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .client-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .client-avatar {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1rem;
      color: white;
      overflow: hidden;
      flex-shrink: 0;
    }
    .client-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .client-info h3 { font-size: 0.95rem; font-weight: 700; }
    .client-info .client-stat { font-size: 0.78rem; color: var(--text-light); }
    .link-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .link-custom { background: #fff3e6; color: #e67e22; }
    .link-custom:hover { background: #e67e22; color: white; }
    .link-standard { background: #e8f4fd; color: #2e86de; }
    .link-standard:hover { background: #2e86de; color: white; }
    .link-dashboard { background: #f0e6ff; color: #111111; }
    .link-dashboard:hover { background: #111111; color: white; }
    .task {
      display: flex;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      align-items: flex-start;
    }
    .task:last-child { border-bottom: none; }
    .task-check {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      border: 2.5px solid #ddd;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
      transition: all 0.2s;
      position: relative;
      appearance: none;
      -webkit-appearance: none;
      background: white;
    }
    .task-check:checked { background: var(--primary); border-color: var(--primary); }
    .task-check:checked::after {
      content: '';
      position: absolute;
      top: 3px; left: 7px;
      width: 6px; height: 11px;
      border: solid white;
      border-width: 0 2.5px 2.5px 0;
      transform: rotate(45deg);
    }
    .task-content { flex: 1; min-width: 0; }
    .task-title {
      font-weight: 700;
      font-size: 0.92rem;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .task.checked .task-title { text-decoration: line-through; color: var(--text-light); }
    .task.checked .task-desc, .task.checked .steps { opacity: 0.5; }
    .steps { list-style: none; padding: 0; }
    .step {
      display: flex;
      gap: 10px;
      padding: 6px 0;
      font-size: 0.85rem;
      color: #555;
      line-height: 1.5;
    }
    .step-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #eef0f8;
      color: var(--primary);
      font-weight: 700;
      font-size: 0.72rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .tip {
      background: #fff8e6;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.82rem;
      color: #856404;
      margin-top: 10px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .tip-icon { font-size: 1rem; flex-shrink: 0; }
    .qa-note {
      width: 100%;
      min-height: 74px;
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
      line-height: 1.5;
      resize: vertical;
    }
    .qa-note:focus {
      outline: 2px solid var(--primary-light);
      outline-offset: 2px;
    }
    .verdict { display: flex; gap: 8px; margin-top: 12px; }
    .verdict button {
      flex: 1;
      padding: 8px 0;
      border-radius: 10px;
      border: 2px solid transparent;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .v-pass { background: #e6f9f0; color: #00856a; border-color: #c3efe0; }
    .v-pass:hover, .v-pass.active { background: var(--success); color: white; border-color: var(--success); }
    .v-fail { background: #fde8e4; color: #c44025; border-color: #f8d2ca; }
    .v-fail:hover, .v-fail.active { background: var(--danger); color: white; border-color: var(--danger); }
    .v-skip { background: #f0f0f5; color: #636e72; border-color: #e0e0e8; }
    .v-skip:hover, .v-skip.active { background: var(--skip); color: white; border-color: var(--skip); }
    .results-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      margin-top: 20px;
      box-shadow: var(--shadow);
      display: none;
      border: 1px solid var(--border);
    }
    .results-card h2 { font-size: 1.1rem; margin-bottom: 16px; }
    .result-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
    }
    .result-row:last-child { border-bottom: none; }
    .result-icon { font-size: 1.1rem; flex-shrink: 0; }
    .result-title { flex: 1; }
    .result-status {
      font-weight: 700;
      font-size: 0.78rem;
      padding: 3px 10px;
      border-radius: 6px;
    }
    .rs-pass { background: #e6f9f0; color: #00856a; }
    .rs-fail { background: #fde8e4; color: #c44025; }
    .rs-skip { background: #f0f0f5; color: #636e72; }
    .rs-none { background: #f0f0f5; color: #aaa; }
    .btn-group { display: flex; gap: 10px; margin-top: 14px; }
    .btn-group .btn { flex: 1; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 14px;
      border: none;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-copy { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; }
    .btn-pdf { background: linear-gradient(135deg, #e17055, #fab1a0); color: white; }
    .btn-reset {
      background: #f0f0f5;
      color: var(--text-light);
      margin-top: 20px;
      width: 100%;
      font-size: 0.85rem;
      padding: 12px;
    }
    .footer {
      text-align: center;
      margin-top: 30px;
      font-size: 0.78rem;
      color: #b2bec3;
    }
    @media (max-width: 600px) {
      body { padding: 12px 10px 30px; }
      .hero { padding: 24px 16px 22px; border-radius: 18px; }
      .hero h1 { font-size: 1.4rem; }
      .section-header { padding: 14px 14px; }
      .section-body { padding: 0 14px 14px; }
      .btn-group { flex-direction: column; }
      .stats-row { flex-direction: row; }
      .link-row { flex-direction: column; }
    }
  </style>
</head>

<div class="hero">
  <h1>NotifyStock E2E QA Form</h1>
  <p class="tagline">Start at Section 0. Follow each step in order. Mark Pass, Fail, or Skip.</p>
  <div class="date-pill" id="dateBar"></div>
</div>

<div class="progress-card">

    <span>Your progress today</span>

  </div>

    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="stats-row">
    <div class="stat-chip stat-pass"><span class="stat-num" id="statPass">0</span>Passed</div>
    <div class="stat-chip stat-fail"><span class="stat-num" id="statFail">0</span>Failed</div>
    <div class="stat-chip stat-skip"><span class="stat-num" id="statSkip">0</span>Skipped</div>
  </div>
</div>

<div id="sectionsRoot"></div>

<div class="results-card" id="resultsBox">
  <h2>Today's Results</h2>
  <div id="resultsList"></div>
  <div class="btn-group">
    <button class="btn btn-copy" onclick="copyResults()">Copy to Clipboard</button>
    <button class="btn btn-pdf" onclick="downloadPDF()">Download PDF</button>
  </div>
</div>

<div style="margin-top:20px;">
  <button class="btn btn-pdf" style="width:100%" onclick="downloadPDF()">Download PDF Report</button>
</div>

<button class="btn btn-reset" onclick="resetAll()">Reset All for Tomorrow</button>

  const now = new Date();
  const dateOpts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  const dateStr = now.toLocaleDateString('en-US', dateOpts);
  document.getElementById('dateBar').textContent = dateStr;
  const storageKey = 'notifystock-e2e-qa-' + now.toISOString().slice(0, 10);
  const ALL_SECTIONS = QA_SECTIONS.map(section => section.id);
  let SECTION_GROUPS = [];

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
  }
  function linkClass(type) {
    if (type === 'dashboard') return 'link-dashboard';
    if (type === 'standard') return 'link-standard';
    return 'link-custom';
  }
  function renderLinks(links) {
    if (!links || !links.length) return '';
    return '<div class="link-row">' + links.map(link => '<a class="link-btn ' + linkClass(link[2]) + '" href="' + escapeHtml(link[1]) + '" target="_blank" rel="noreferrer">' + escapeHtml(link[0]) + '</a>').join('') + '</div>';
  }
  function renderTask(task, sectionId) {
    const taskLinks = renderLinks(task.links);
    const steps = task.steps.map((step, index) => '<li class="step"><span class="step-num">' + (index + 1) + '</span><span>' + escapeHtml(step) + '</span></li>').join('');
    const tip = task.tip ? '<div class="tip"><span class="tip-icon">Note:</span><span>' + escapeHtml(task.tip) + '</span></div>' : '';
    return `<div class="task" data-section="${sectionId}"><input type="checkbox" class="task-check" onchange="updateProgress()"><div class="task-content"><div class="task-title">${escapeHtml(task.title)}</div>${taskLinks}<ul class="steps">${steps}</ul>${tip}<div class="verdict"><button class="v-pass" onclick="setVerdict(this,'pass')">Pass</button><button class="v-fail" onclick="setVerdict(this,'fail')">Fail</button><button class="v-skip" onclick="setVerdict(this,'skip')">Skip</button></div></div></div>`;
  }
  function renderSections() {
    let taskIndex = 0;
    SECTION_GROUPS = QA_SECTIONS.map(section => {
      const group = { name: section.title, color: section.pdfColor, start: taskIndex, end: taskIndex + section.tasks.length };
      taskIndex += section.tasks.length;
      return group;
    });
    document.getElementById('sectionsRoot').innerHTML = QA_SECTIONS.map(section => {
      const links = section.links && section.links.length ? '<div class="client-card"><div class="client-top"><div class="client-avatar" style="background:' + section.color + '">' + escapeHtml(section.num) + '</div><div class="client-info"><h3>Open these links for this section</h3><div class="client-stat">Use these buttons instead of guessing where to go</div></div></div>' + renderLinks(section.links) + '</div>' : '';
      const tasks = section.tasks.map(task => renderTask(task, section.id)).join('');
      return `<div class="section" id="${section.id}"><div class="section-header" onclick="toggle('${section.id}')"><div class="section-num" style="background:${section.color}">${escapeHtml(section.num)}</div><h2>${escapeHtml(section.title)}<small>${escapeHtml(section.small)}</small></h2><span class="section-badge" id="badge-${section.id}">0/${section.tasks.length}</span><span class="section-chevron">&#9662;</span></div><div class="section-body"><div class="intro-text">${escapeHtml(section.intro)}</div>${links}${tasks}<div class="tip"><span class="tip-icon">Note:</span><span>If anything failed in this section, write the issue, screenshot name, or Loom timestamp below.</span></div><textarea class="qa-note" data-note="${section.id}" oninput="saveState(); updateResults()" placeholder="Write section notes here."></textarea></div></div>`;
    }).join('');
  }

  function loadState() {
    try {
      const s = JSON.parse(localStorage.getItem(storageKey) || '{}');
      const cbs = document.querySelectorAll('.task-check');
      cbs.forEach((cb, i) => {
        if (s.checks && s.checks[i]) { cb.checked = true; cb.closest('.task').classList.add('checked'); }
      });
      if (s.verdicts) {
        document.querySelectorAll('.verdict').forEach((v, i) => {
          if (s.verdicts[i]) {
            const btn = v.querySelector('.v-' + s.verdicts[i]);
            if (btn) btn.classList.add('active');
          }
        });
      }
      if (s.notes) {
        document.querySelectorAll('.qa-note').forEach(note => {
          if (Object.prototype.hasOwnProperty.call(s.notes, note.dataset.note)) note.value = s.notes[note.dataset.note];
        });
      }
      updateProgress();
    } catch(e) {}
  }
  function saveState() {
    const checks = []; const verdicts = []; const notes = {};
    document.querySelectorAll('.task-check').forEach(cb => checks.push(cb.checked));
    document.querySelectorAll('.verdict').forEach(v => {
      if (v.querySelector('.v-pass.active')) verdicts.push('pass');
      else if (v.querySelector('.v-fail.active')) verdicts.push('fail');
      else if (v.querySelector('.v-skip.active')) verdicts.push('skip');
      else verdicts.push(null);
    });
    document.querySelectorAll('.qa-note').forEach(note => { notes[note.dataset.note] = note.value; });
    localStorage.setItem(storageKey, JSON.stringify({ checks, verdicts, notes }));
  }
  function updateProgress() {
    const all = document.querySelectorAll('.task-check');
    const checked = document.querySelectorAll('.task-check:checked');
    const pct = all.length ? Math.round((checked.length / all.length) * 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressPct').textContent = pct + '%';
    document.getElementById('statPass').textContent = document.querySelectorAll('.v-pass.active').length;
    document.getElementById('statFail').textContent = document.querySelectorAll('.v-fail.active').length;
    document.getElementById('statSkip').textContent = document.querySelectorAll('.v-skip.active').length;
    ALL_SECTIONS.forEach(sec => {
      const t = document.querySelectorAll('#' + sec + ' .task-check');
      const d = document.querySelectorAll('#' + sec + ' .task-check:checked');
      const badge = document.getElementById('badge-' + sec);
      if (badge) {
        badge.textContent = d.length + '/' + t.length;
        badge.classList.toggle('done', d.length === t.length && t.length > 0);
      }
    });
    all.forEach(cb => cb.closest('.task').classList.toggle('checked', cb.checked));
    saveState();
    updateResults();
  }
  function setVerdict(btn, type) {
    const v = btn.closest('.verdict');
    v.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const cb = btn.closest('.task').querySelector('.task-check');
    if (cb && !cb.checked) cb.checked = true;
    updateProgress();
  }
  function toggle(id) { document.getElementById(id).classList.toggle('collapsed'); }
  function getTaskResults() {
    const results = [];
    document.querySelectorAll('.task').forEach(task => {
      const title = task.querySelector('.task-title')?.textContent || '';
      const v = task.querySelector('.verdict');
      let status = 'NOT TESTED';
      if (v) {
        if (v.querySelector('.v-pass.active')) status = 'PASS';
        else if (v.querySelector('.v-fail.active')) status = 'FAIL';
        else if (v.querySelector('.v-skip.active')) status = 'SKIP';
      }
      results.push({ title, status });
    });
    return results;
  }
  function getSectionNotes() {
    return QA_SECTIONS.map(section => {
      const note = document.querySelector('.qa-note[data-note="' + section.id + '"]');
      return { title: section.title, value: note ? note.value.trim() : '' };
    }).filter(note => note.value);
  }
  function updateResults() {
    const results = getTaskResults();
    const tested = results.filter(r => r.status !== 'NOT TESTED');
    const box = document.getElementById('resultsBox');
    if (tested.length === 0 && getSectionNotes().length === 0) { box.style.display = 'none'; return; }
    box.style.display = 'block';
    let html = '';
    results.forEach(r => {
      const cls = r.status === 'PASS' ? 'rs-pass' : r.status === 'FAIL' ? 'rs-fail' : r.status === 'SKIP' ? 'rs-skip' : 'rs-none';
      const icon = r.status === 'PASS' ? '&#9989;' : r.status === 'FAIL' ? '&#10060;' : r.status === 'SKIP' ? '&#9898;' : '&#11036;';
      html += '<div class="result-row"><span class="result-icon">' + icon + '</span><span class="result-title">' + escapeHtml(r.title) + '</span><span class="result-status ' + cls + '">' + r.status + '</span></div>';
    });
    const notes = getSectionNotes();
    if (notes.length) {
      html += '<div class="intro-text" style="margin-top:14px;"><strong>Section notes:</strong><br>' + notes.map(note => escapeHtml(note.title) + ': ' + escapeHtml(note.value)).join('<br>') + '</div>';
    }
    document.getElementById('resultsList').innerHTML = html;
  }
  function copyResults() {
    const results = getTaskResults();
    const passes = results.filter(r => r.status === 'PASS').length;
    const fails = results.filter(r => r.status === 'FAIL').length;
    const skips = results.filter(r => r.status === 'SKIP').length;
    let text = 'NotifyStock E2E QA Report - ' + dateStr + '\n' + '='.repeat(46) + '\n\n';
    results.forEach(r => {
      const icon = r.status === 'PASS' ? '+' : r.status === 'FAIL' ? 'X' : r.status === 'SKIP' ? '-' : '?';
      text += '[' + icon + '] ' + r.title + ' - ' + r.status + '\n';
    });
    const notes = getSectionNotes();
    if (notes.length) {
      text += '\nSection Notes\n' + '-'.repeat(20) + '\n';
      notes.forEach(note => { text += note.title + ': ' + note.value + '\n'; });
    }
    text += '\nTotal: ' + passes + ' passed, ' + fails + ' failed, ' + skips + ' skipped, ' + results.length + ' total tasks\n';
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('.btn-copy');
      const orig = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = orig, 2000);
    });
  }
  function downloadPDF() {
    if (!window.jspdf) {
      alert('PDF library is still loading. Please wait a moment and try again.');
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const results = getTaskResults();
    const passes = results.filter(r => r.status === 'PASS').length;
    const fails = results.filter(r => r.status === 'FAIL').length;
    const skips = results.filter(r => r.status === 'SKIP').length;
    const tested = results.filter(r => r.status !== 'NOT TESTED').length;
    doc.setFillColor(108, 92, 231);
    doc.rect(0, 0, 210, 45, 'F');
    doc.setFillColor(162, 155, 254);
    doc.circle(180, 10, 25, 'F');
    doc.setFillColor(116, 185, 255);
    doc.circle(30, 40, 15, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(24);
    doc.setFont('helvetica', 'bold');
    doc.text('NotifyStock E2E QA Report', 105, 20, { align: 'center' });
    doc.setFontSize(12);
    doc.setFont('helvetica', 'normal');
    doc.text(dateStr, 105, 32, { align: 'center' });
    doc.setFontSize(10);
    doc.text('Website, Shopify admin, storefront, features, billing, AI, and mobile', 105, 40, { align: 'center' });
    let y = 55;
    const boxW = 42, boxH = 22, startX = 14, gap = 4;
    const summary = [
      ['TESTED', tested, [238,240,248], [17,17,17]],
      ['PASSED', passes, [230,249,240], [0,133,106]],
      ['FAILED', fails, [253,232,228], [196,64,37]],
      ['SKIPPED', skips, [240,240,245], [99,110,114]]
    ];
    summary.forEach((s, i) => {
      const x = startX + i * (boxW + gap);
      doc.setFillColor(...s[2]);
      doc.roundedRect(x, y, boxW, boxH, 3, 3, 'F');
      doc.setFontSize(16);
      doc.setFont('helvetica', 'bold');
      doc.setTextColor(...s[3]);
      doc.text(String(s[1]), x + boxW/2, y + 10, { align: 'center' });
      doc.setFontSize(8);
      doc.setTextColor(100, 100, 100);
      doc.text(s[0], x + boxW/2, y + 17, { align: 'center' });
    });
    y += boxH + 15;
    doc.setDrawColor(220, 220, 230);
    doc.line(14, y, 196, y);
    y += 10;
    SECTION_GROUPS.forEach(sec => {
      if (y > 260) { doc.addPage(); y = 20; }
      doc.setFillColor(...sec.color);
      doc.roundedRect(14, y - 4, 3, 14, 1, 1, 'F');
      doc.setFontSize(12);
      doc.setFont('helvetica', 'bold');
      doc.setTextColor(50, 50, 50);
      doc.text(sec.name, 22, y + 5);
      y += 14;
      results.slice(sec.start, sec.end).forEach(t => {
        if (y > 275) { doc.addPage(); y = 20; }
        let badgeColor, textColor;
        if (t.status === 'PASS') { badgeColor = [230,249,240]; textColor = [0,133,106]; }
        else if (t.status === 'FAIL') { badgeColor = [253,232,228]; textColor = [196,64,37]; }
        else if (t.status === 'SKIP') { badgeColor = [240,240,245]; textColor = [99,110,114]; }
        else { badgeColor = [240,240,245]; textColor = [170,170,170]; }
        doc.setFillColor(...badgeColor);
        doc.roundedRect(22, y - 4, 22, 7, 2, 2, 'F');
        doc.setFontSize(7);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(...textColor);
        doc.text(t.status, 33, y + 1, { align: 'center' });
        doc.setTextColor(60, 60, 60);
        doc.setFontSize(9);
        doc.setFont('helvetica', 'normal');
        const titleLines = doc.splitTextToSize(t.title, 140);
        doc.text(titleLines, 48, y + 1);
        y += Math.max(8, titleLines.length * 5 + 3);
      });
      y += 4;
    });
    const notes = getSectionNotes();
    if (notes.length) {
      if (y > 245) { doc.addPage(); y = 20; }
      doc.setFontSize(12);
      doc.setFont('helvetica', 'bold');
      doc.setTextColor(50, 50, 50);
      doc.text('Section Notes', 14, y);
      y += 8;
      doc.setFontSize(9);
      doc.setFont('helvetica', 'normal');
      notes.forEach(note => {
        if (y > 275) { doc.addPage(); y = 20; }
        const noteLines = doc.splitTextToSize(note.title + ': ' + note.value, 176);
        doc.text(noteLines, 14, y);
        y += noteLines.length * 5 + 4;
      });
    }
    if (y > 265) { doc.addPage(); y = 20; }
    y += 6;
    doc.setDrawColor(220, 220, 230);
    doc.line(14, y, 196, y);
    y += 10;
    doc.setFontSize(8);
    doc.setTextColor(170, 170, 170);
    doc.text('Generated from NotifyStock E2E QA Form - mohmmadmuneeb.github.io/notifystock', 105, y, { align: 'center' });
    doc.save('NotifyStock-E2E-QA-' + now.toISOString().slice(0, 10) + '.pdf');
    const btn = document.querySelector('.btn-pdf');
    if (btn) {
      const orig = btn.textContent;
      btn.textContent = 'Downloaded!';
      setTimeout(() => btn.textContent = orig, 2000);
    }
  }
  function resetAll() {
    if (!confirm('Reset everything for a fresh start tomorrow?')) return;
    localStorage.removeItem(storageKey);
    document.querySelectorAll('.task-check').forEach(cb => { cb.checked = false; });
    document.querySelectorAll('.verdict button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.task').forEach(t => t.classList.remove('checked'));
    document.querySelectorAll('.qa-note').forEach(note => { note.value = ''; });
    updateProgress();
  }
  renderSections();
  loadState();
</script>
